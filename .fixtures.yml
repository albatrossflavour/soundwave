---
fixtures:
  forge_modules:
    stdlib:
      repo: "puppetlabs/stdlib"
      ref: "10.1.1"
    python:
      repo: "puppet/python"
      ref: "10.1.0"
    epel:
      repo: "puppet/epel"
      ref: "6.1.2"
    systemd:
      repo: "puppet/systemd"
      ref: "11.1.0"
    inifile:
      repo: "puppetlabs/inifile"
      ref: "6.6.0"
    node_encrypt:
      repo: "puppetlabs/node_encrypt"
      ref: "4.1.0"
    yumrepo_core:
      repo: "puppetlabs/yumrepo_core"
      ref: "2.1.0"
  repositories:
    # Not a metadata dependency: only soundwave::rbac_user and the main class's
    # token_password need it, and a site that uses either adds it to its
    # Puppetfile. The fork is the one whose rbac_token renews.
    rbac:
      repo: "git@github.com:albatrossflavour/conductor-rbac.git"
      branch: "modernise"
